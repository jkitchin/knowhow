[project]
name = "skillz"
version = "0.1.0"
description = "A CLI tool for managing AI assistant skills and slash commands for OpenCode, Claude Code, and other LLM platforms"
authors = [
    {name = "John Kitchin", email = "jkitchin@andrew.cmu.edu"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["claude", "ai", "llm", "skills", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.3.2",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
]
git = [
    "gitpython>=3.1.0",
]
templates = [
    "jinja2>=3.0.0",
]

[project.scripts]
skillz = "cli.main:cli"

[project.urls]
Homepage = "https://github.com/jkitchin/skillz"
Documentation = "https://github.com/jkitchin/skillz#readme"
Repository = "https://github.com/jkitchin/skillz"
Issues = "https://github.com/jkitchin/skillz/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=cli --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Hooks contain embedded scripts (PowerShell, etc.) with long lines
"hooks/**/hook.py" = ["E501"]
# Example files use scientific variable naming (E_slab, R, G, B) and demo patterns
"skills/**/examples/*.py" = ["N803", "N806", "E722", "F841", "E402", "UP028", "F401", "I001", "F541", "UP024", "UP015"]

[tool.coverage.run]
source = ["cli"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
