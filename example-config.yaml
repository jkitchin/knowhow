# Example configuration file for knowhow
# Copy this to ~/.config/skillz/config.yaml and customize

# Default platform when --platform / -a is omitted: a built-in (claude, opencode,
# codex, gemini) or any platform defined under `platforms:` below.
# Leave it as `claude` to let `knowhow add` auto-detect installed agents.
default_platform: claude

# Personal installation directories (used when no --target specified)
personal_skills_dir: ~/.claude/skills
personal_commands_dir: ~/.claude/commands

# Project installation directories (used with --target project)
project_skills_dir: .claude/skills
project_commands_dir: .claude/commands

# Default installation target (personal or project)
default_target: personal

# Path to the knowhow repository (for browsing and installing skills)
# Set this to your local clone of the repository
repository_path: /path/to/your/clone

# Source aliases for `knowhow add`, e.g. `knowhow add kitchin -s pycse`
aliases:
  kitchin: jkitchin/knowhow

# Platform-specific directories
# Skills will be installed to the appropriate platform's directory
platforms:
  claude:
    skills_dir: ~/.claude/skills
    commands_dir: ~/.claude/commands

  opencode:
    skills_dir: ~/.config/opencode/skills
    commands_dir: ~/.config/opencode/command

  codex:
    skills_dir: ~/.codex/skills
    commands_dir: ~/.codex/commands

  gemini:
    skills_dir: ~/.config/gemini/skills
    commands_dir: ~/.config/gemini/commands

  # A custom platform. Use it with `knowhow install NAME --platform picoclaw` or
  # `knowhow add owner/repo -s NAME -a picoclaw`, or make it the default above.
  # Names: lowercase letters, digits and hyphens. Only set the keys you use;
  # a command that needs a missing one says which key to add.
  # `knowhow add` copies skills here (no symlinks, so Docker mounts work).
  picoclaw:
    skills_dir: ~/picoclaw/docker/data/workspace/skills        # global / personal
    commands_dir: ~/picoclaw/docker/data/workspace/commands
    project_skills_dir: .picoclaw/skills                        # --target project / add without -g
    # project_commands_dir: .picoclaw/commands
    # hooks_dir, agents_dir, settings_file (+ project_* forms) for hooks and subagents

